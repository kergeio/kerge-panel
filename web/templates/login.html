{{define "title"}}{{t "login.title"}}{{end}}
{{define "content"}}
<div class="mx-auto mt-16 max-w-sm rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
<h1 class="mb-6 text-center text-xl font-semibold">{{t "app.name"}}</h1>
<form method="post" action="/login" class="space-y-4">
{{template "form-error" .Data.Error}}
<input type="hidden" name="csrf_token" value="{{.CSRF}}">
<label class="block">
<span class="mb-1 block text-sm font-medium">{{t "login.username"}}</span>
<input name="username" type="text" value="{{.Data.Username}}" autocomplete="username" required autofocus class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-gray-500 focus:outline-none">
</label>
<label class="block">
<span class="mb-1 block text-sm font-medium">{{t "login.password"}}</span>
<input name="password" type="password" autocomplete="current-password" required class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-gray-500 focus:outline-none">
</label>
<button type="submit" class="w-full rounded-md bg-gray-900 px-3 py-2 font-medium text-white hover:bg-gray-700">{{t "login.submit"}}</button>
</form>
</div>
{{end}}
